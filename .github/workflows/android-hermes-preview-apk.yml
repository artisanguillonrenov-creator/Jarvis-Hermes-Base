name: Build Hermes Android Preview APK

on:
  push:
    branches:
      - chatgpt/android-hermes-preview-apk
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.11.0'
          cache: npm

      - name: Use repository-compatible npm
        run: npm install -g npm@11.19.1

      - name: Install Desktop renderer dependencies
        run: npm ci --workspace apps/desktop --workspace apps/shared --include-workspace-root

      - name: Build real Hermes Desktop renderer
        run: npm exec --workspace apps/desktop -- vite build --minify=false --sourcemap

      - name: Stage renderer for Android
        shell: bash
        run: |
          set -euo pipefail
          ASSETS="android/hermes-preview/app/src/main/assets/www"
          rm -rf "$ASSETS"
          mkdir -p "$ASSETS"
          cp -R apps/desktop/dist/. "$ASSETS/"
          cp android/hermes-preview/android-bridge-shim.js "$ASSETS/android-bridge-shim.js"
          python - <<'PY'
          from pathlib import Path
          p = Path('android/hermes-preview/app/src/main/assets/www/index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<script src="./android-bridge-shim.js"></script>'
          if marker not in s:
              if '</head>' in s:
                  s = s.replace('</head>', marker + '\n</head>', 1)
              else:
                  s = marker + '\n' + s
          p.write_text(s, encoding='utf-8')
          PY

      - name: Smoke-test staged Hermes renderer
        shell: bash
        run: |
          set -euo pipefail
          npm exec --workspace apps/desktop -- playwright install chromium
          python3 -m http.server 4178 --directory android/hermes-preview/app/src/main/assets/www >/tmp/hermes-preview-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          cd apps/desktop
          node --input-type=module <<'JS'
          import { chromium } from '@playwright/test'
          const browser = await chromium.launch({ headless: true })
          const page = await browser.newPage({ viewport: { width: 1280, height: 800 } })
          const errors = []
          page.on('pageerror', err => errors.push(`PAGEERROR: ${err.stack || err.message}`))
          page.on('console', msg => {
            const text = msg.text()
            if (msg.type() === 'error' || /error|exception|not a function/i.test(text)) {
              errors.push(`CONSOLE ${msg.type()}: ${text}`)
            }
          })
          await page.goto('http://127.0.0.1:4178/index.html', { waitUntil: 'domcontentloaded' })
          await page.waitForTimeout(5000)
          const body = await page.locator('body').innerText().catch(() => '')
          console.log('--- RENDERED BODY ---')
          console.log(body.slice(0, 5000))
          console.log('--- END BODY ---')
          if (/Something broke in the interface|Hermes Android preview — JavaScript error|Hermes Android preview — startup error/i.test(body)) {
            errors.push('Renderer reached its fatal/error-boundary UI')
          }
          if (errors.length) {
            console.error('--- RENDER ERRORS ---')
            console.error(errors.join('\n\n'))
            await browser.close()
            process.exit(1)
          }
          await browser.close()
          JS

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: gradle -p android/hermes-preview :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp android/hermes-preview/app/build/outputs/apk/debug/app-debug.apk Hermes-Android-Preview.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hermes-Android-Preview-APK
          path: Hermes-Android-Preview.apk
          if-no-files-found: error
          retention-days: 14
