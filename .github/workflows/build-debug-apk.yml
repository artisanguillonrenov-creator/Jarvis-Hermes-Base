name: Cortana spike — build debug APK

# Phase 1 of CORTANA_DIRECTIVES_CLAUDE_CODE_APPLICATION_INSTALLABLE.md: turn
# proof-of-architecture/ into a real, installable .apk without requiring a
# local Android SDK or a physical device. On success, the APK is published as
# a GitHub release asset that William can download straight from his
# tablet's browser. On failure, the job fails visibly with the full Gradle
# log in the Actions tab — never silently.

on:
  push:
    branches:
      - "spike/0.5-proof-of-architecture"
    paths:
      - "proof-of-architecture/**"
      - ".github/workflows/build-debug-apk.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proof-of-architecture
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      # Builds the real Hermes web dashboard (StatusPage/ConfigPage/EnvPage/ChatPage) so the app
      # can bundle it and run `hermes dashboard --skip-build` on-device, where there is no
      # Node/npm to build it. Vite's own config (web/vite.config.ts) already outputs straight to
      # hermes_cli/web_dist — the exact path `--skip-build` looks for by default.
      - name: Build the Hermes web dashboard
        working-directory: .
        run: |
          npm install --workspace web
          npm run build --workspace web

      # This stages ONLY the dashboard's built assets, not the rest of the Hermes Python source
      # tree (agent/, hermes_cli/*.py, tui_gateway/, pyproject.toml, ...) — that full source tree,
      # needed for `pip install -e ".[termux]"` to work at all, still isn't bundled by this PR.
      # See proof-of-architecture/README.md for that larger documented gap (it depends on Phase 2's
      # native Python bootstrap landing first).
      - name: Stage the built web dashboard into the app's assets
        working-directory: .
        run: |
          set -euo pipefail
          test -f hermes_cli/web_dist/index.html
          mkdir -p proof-of-architecture/app/src/main/assets/runtime_payload/hermes-src/hermes_cli
          rm -rf proof-of-architecture/app/src/main/assets/runtime_payload/hermes-src/hermes_cli/web_dist
          cp -r hermes_cli/web_dist proof-of-architecture/app/src/main/assets/runtime_payload/hermes-src/hermes_cli/web_dist

      # GitHub-hosted ubuntu-latest runners ship a full, pre-licensed Android SDK
      # already (ANDROID_HOME/ANDROID_SDK_ROOT are pre-set) — no separate SDK
      # install action needed. (android-actions/setup-android@v3 was tried here
      # first and fails outright: it runs `sdkmanager tools`, and Google removed
      # that legacy "tools" package from the SDK repository years ago — exit
      # code 1 before Gradle even starts. Not used for that reason.)
      - name: Accept Android SDK licenses (non-interactive, safety net)
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -maxdepth 2 -type f -name sdkmanager | sort -V | tail -1)
          if [ -z "$SDKMANAGER" ]; then
            echo "No sdkmanager found under $SDK_ROOT/cmdline-tools — relying on Gradle/AGP's own SDK auto-download instead." >&2
          else
            yes | "$SDKMANAGER" --licenses || true
          fi

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Compute release tag
        id: tag
        run: echo "tag=spike-apk-$(date -u +%Y%m%d-%H%M)" >> "$GITHUB_OUTPUT"

      - name: Publish debug APK as a GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "Expected APK not found at $APK_PATH" >&2
            find app/build/outputs -type f -name '*.apk' >&2 || true
            exit 1
          fi
          gh release create "${{ steps.tag.outputs.tag }}" "$APK_PATH" \
            --repo "${{ github.repository }}" \
            --title "Cortana spike debug APK — ${{ steps.tag.outputs.tag }}" \
            --notes "Debug APK built from commit ${{ github.sha }} on branch ${{ github.ref_name }}. Bundles the real built Hermes web dashboard (hermes_cli/web_dist), but not yet the rest of the Hermes Python source tree or the native Python/Termux bootstrap — runtime install/native-healthcheck will still fail on-device until Phase 2 lands. See proof-of-architecture/README.md for the documented gaps. Install by opening this release page in the tablet's browser and downloading the .apk asset."
